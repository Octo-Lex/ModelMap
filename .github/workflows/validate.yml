name: validate-corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression and generated-view tests
        run: python -m unittest discover -s tests -v
      - name: Validate schemas, records, and references
        run: python tools/validate.py
      - name: Build chronological timeline
        run: python tools/build_timeline.py --format json > /tmp/modelmap-timeline.json
      - name: Build 2017 year view
        run: python tools/build_year.py 2017 --format json > /tmp/modelmap-2017.json
      - name: Build 2018 year view
        run: python tools/build_year.py 2018 --format json > /tmp/modelmap-2018.json
      - name: Build 2019 year view
        run: python tools/build_year.py 2019 --format json > /tmp/modelmap-2019.json
      - name: Build 2020 year view
        run: python tools/build_year.py 2020 --format json > /tmp/modelmap-2020.json
      - name: Build 2021 year view
        run: python tools/build_year.py 2021 --format json > /tmp/modelmap-2021.json
      - name: Build 2022 year view
        run: python tools/build_year.py 2022 --format json > /tmp/modelmap-2022.json
      - name: Build 2023 year view
        run: python tools/build_year.py 2023 --format json > /tmp/modelmap-2023.json
      - name: Build 2024 year view
        run: python tools/build_year.py 2024 --format json > /tmp/modelmap-2024.json
      - name: Build 2025 year view
        run: python tools/build_year.py 2025 --format json > /tmp/modelmap-2025.json
      - name: Build 2026 year view
        run: python tools/build_year.py 2026 --format json > /tmp/modelmap-2026.json
      - name: Build browse catalog
        run: python tools/build_catalog.py > /tmp/modelmap-catalog.json
      - name: Build core knowledge graph
        run: python tools/build_graph.py --scope core > /tmp/modelmap-graph-core.json
      - name: Build full knowledge graph
        run: python tools/build_graph.py --scope all > /tmp/modelmap-graph-all.json
      - name: Build representative model entity view
        run: python tools/build_entity.py release:gpt-5.6 > /tmp/modelmap-gpt-5.6.json
