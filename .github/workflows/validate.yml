name: validate-corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run review-hardening regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate schemas, records, and references
        run: python tools/validate.py
      - name: Build chronological timeline
        run: python tools/build_timeline.py --format json > /tmp/modelmap-timeline.json
      - name: Build 2023 year view
        run: python tools/build_year.py 2023 --format json > /tmp/modelmap-2023.json
